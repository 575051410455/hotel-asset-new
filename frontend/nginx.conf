# Internal static server for the built SPA (the edge nginx proxies "/" here).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: always fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
