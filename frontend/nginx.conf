# Internal static server for the built SPA (the edge nginx proxies "/" here).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────────
    # This nginx serves index.html, so the document's CSP is set HERE (the edge
    # proxy passes upstream headers through). The edge already adds X-Frame-Options
    # / X-Content-Type-Options / Referrer-Policy; CSP is the piece it lacks.
    #
    # CSP tuned to what THIS build actually loads (verified against dist/):
    #   • script-src 'self'         Vite emits only external hashed modules — no
    #                               inline <script> — so this blocks injected inline
    #                               scripts and blunts XSS exfiltrating the token.
    #   • style-src  'unsafe-inline' + fonts.googleapis.com
    #                               React inline style={} attributes and the Google
    #                               Fonts @import in index.css both need these.
    #   • font-src   fonts.gstatic.com   the actual IBM Plex woff2 files.
    #   • img-src    data: blob:    canvas + floor-plan image rendering.
    #   • frame-ancestors 'none'    clickjacking guard (supersedes X-Frame-Options).
    #
    # nginx gotcha: add_header is NOT inherited by a location that sets its own
    # add_header, so the /assets/ block re-declares these.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declared: this location's own add_header suppresses the server-level ones.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: always fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
