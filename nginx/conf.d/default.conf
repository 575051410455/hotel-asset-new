# Ops Monitor — edge reverse proxy (HTTP).
# Routes:  /api  + /uploads -> backend:3000   |   everything else -> frontend:80
#
# TLS is terminated at Cloudflare's edge and the request reaches us through the
# host's cloudflared connector, so this server block stays plain HTTP and there
# is no certificate on this box. See docs/html-deploy-production.html.

# Cloudflare puts the true visitor IP in CF-Connecting-IP and cloudflared passes
# it through. Trust that header ONLY from the private Docker bridge ranges the
# connector can occupy — never from an arbitrary source, or anyone reaching
# nginx directly could forge their own address into the logs.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# The edge terminated TLS, so $scheme here is "http" and passing it upstream
# would tell the backend it is running insecurely — which breaks the Google
# OAuth redirect_uri and the secure flag on the OAuth state cookie. Prefer the
# forwarded value, falling back to $scheme for direct LAN access in phase 1.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;            # the tunnel decides the hostname; nothing to set

    # Floor-plan uploads can be up to 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API -> backend container ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # --- uploaded floor-plan images -> backend static ---
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- the React SPA -> frontend static server ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# ── No 443 block, and no certificate on this host ────────────────────────────
# Cloudflare terminates TLS at the edge and the request arrives over the
# host's cloudflared connector as plain HTTP on port 80 above. Adding a 443
# server block here would never receive traffic.
