# Ops Monitor — edge reverse proxy (HTTP).
# Routes:  /api  + /uploads -> backend:3000   |   everything else -> frontend:80
#
# TLS is terminated at Cloudflare's edge and the request reaches us through the
# host's cloudflared connector, so this server block stays plain HTTP and there
# is no certificate on this box. See docs/html-deploy-production.html.

# Cloudflare puts the true visitor IP in CF-Connecting-IP and cloudflared passes
# it through. Trust that header ONLY from the Docker bridge ranges the connector
# can occupy — never from an arbitrary source, or anyone reaching nginx directly
# could forge their own address into the logs.
#
# 192.168.0.0/16 is deliberately NOT trusted: port 80 stays published on the
# office LAN, which lives in that range, so trusting it would let any staff
# machine forge its own logged address — exactly what this guard prevents.
# Docker allocates bridges from 172.17-172.31 (and 10.x for overlay networks);
# confirm the connector's actual subnet with scripts/preflight.sh.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# The edge terminates TLS, so $scheme here is always "http". Forward the scheme
# the client actually used rather than the one we observed, so upstream logs and
# any future redirect building see the truth.
#
# NOTE: nothing in the backend reads X-Forwarded-Proto today — the Google
# redirect_uri and the OAuth state cookie's secure flag are both derived from
# FRONTEND_URL, not from this header. This is hygiene, not a fix for a live bug.
# Unlike CF-Connecting-IP above, this value is accepted from any client; that is
# tolerable only while nothing consumes it. Guard it before anything does.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;            # the tunnel decides the hostname; nothing to set

    # Floor-plan uploads can be up to 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API -> backend container ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # --- uploaded floor-plan images -> backend static ---
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- the React SPA -> frontend static server ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# ── No 443 block, and no certificate on this host ────────────────────────────
# Cloudflare terminates TLS at the edge and the request arrives over the
# host's cloudflared connector as plain HTTP on port 80 above. Adding a 443
# server block here would never receive traffic.
