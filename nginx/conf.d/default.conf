# Ops Monitor — edge reverse proxy (HTTP).
# Routes:  /api  + /uploads -> backend:3000   |   everything else -> frontend:80
# For HTTPS (Let's Encrypt), see docs/deployment.html and add a 443 server block.

server {
    listen 80;
    server_name _;            # replace with your domain, e.g. ops.example.com

    # Floor-plan uploads can be up to 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API -> backend container ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- uploaded floor-plan images -> backend static ---
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- the React SPA -> frontend static server ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

