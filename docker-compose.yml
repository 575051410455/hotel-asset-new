name: ops-monitor

# Ops Monitoring Dashboard — full stack in Docker Compose.
# Services:  nginx (edge) · frontend (SPA) · backend (API) · db (Postgres)
# Only nginx is published to the host (port 80; add 443 for TLS).
# Secrets come from a .env file next to this one — see .env.example.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-opsmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [opsnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsmonitor} -d ${POSTGRES_DB:-opsmonitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opsmonitor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsmonitor}
      PORT: "3000"
      # The public https origin (the tunnel hostname). Required: only requests from
      # this origin may change data, and it makes the session cookie Secure. The
      # backend refuses to start without a valid https value.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL to the public https origin in .env}
      # Google "Sign in with Google" — blank disables the feature.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
    volumes:
      - uploads:/app/uploads      # persists uploaded floor-plan images
    depends_on:
      db:
        condition: service_healthy
    networks: [opsnet]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [opsnet]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Kept deliberately. This host has NO public IP, so binding :80 exposes the
      # app to the office LAN only — which is the phase-1 test path and stays the
      # way in when the tunnel is down. On a host that DOES hold a public IP this
      # line must be deleted: it would bypass every Cloudflare protection.
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [frontend, backend]
    # opsnet      — this project's private network (db, backend, frontend)
    # hms-network — the network the host's EXISTING cloudflared connector is on.
    #               nginx joins it so that connector can reach us; we run no
    #               cloudflared of our own and hold no tunnel token.
    networks: [opsnet, hms-network]

volumes:
  pgdata:
  uploads:

networks:
  opsnet:

  # ── Dependency on another project, recorded deliberately ──────────────────
  # Created and owned by the stack that runs this host's cloudflared connector,
  # NOT by this file. We mark it external so Compose attaches to it rather than
  # creating its own.
  #
  # The risk that buys: if that project is torn down, or renames this network,
  # `docker compose up` here fails with "network hms-network declared as
  # external, but could not be found" until this file is edited. That was the
  # accepted trade for not running a second connector and not modifying a
  # project this repository does not own.
  #
  # Confirm the name before changing it:
  #   docker inspect -f '{{range $$k,$$v := .NetworkSettings.Networks}}{{$$k}} {{end}}' <cloudflared-container>
  hms-network:
    external: true
